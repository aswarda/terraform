# DEV manifest — namespace web1. Deployed AUTOMATICALLY by Cloud Deploy.
# The image "sampleapp" is a placeholder; Cloud Deploy swaps it for the real
# Artifact Registry image at release time (--images=sampleapp=...).
apiVersion: v1
kind: Namespace
metadata:
  name: web1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampleapp
  namespace: web1
  labels:
    app: sampleapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sampleapp
  template:
    metadata:
      labels:
        app: sampleapp
    spec:
      containers:
        - name: web1
          image: sampleapp
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sampleapp
  namespace: web1
spec:
  type: NodePort
  selector:
    app: sampleapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sampleapp
  namespace: web1
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: sampleapp
                port:
                  number: 80
