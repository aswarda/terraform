# =====================================================================
# Terraform DESTROY pipeline in Cloud Build.
#   init -> fetch reviewed destroy-plan -> apply (destroy)
#
# Pattern:
#   - "destroy" trigger : fired automatically by the destroy-plan build's
#     trigger-apply step, NOT run manually and NOT run on push.
#   - This trigger has "Require approval" checked in the Cloud Build
#     UI/trigger config -> the build sits PENDING until a human with
#     the Cloud Build Approver role approves it = your gate.
#     (Destroy is irreversible — treat this approval as non-negotiable,
#     ideally a separate/higher-privilege approver group than apply.)
#   - Downloads the exact destroy-tfplan produced by the plan build
#     identified by _PLAN_BUILD_ID, so this destroys EXACTLY what was
#     reviewed — nothing more, nothing implicit.
#
# State lives in the existing GCS backend (backend.tf: bucket aswarda-tfstate-dev).
# Run from the repo root that contains the .tf files.
# =====================================================================
tags:
  - aswarda-terraform-destroy-$SHORT_SHA
substitutions:
  _TF_VERSION: "1.9.8"
  _PLAN_BUCKET: "aswarda-tfstate-dev"
  _PLAN_BUILD_ID: "" # passed in automatically by the destroy-plan build's trigger-apply step
steps:
  # 1) init — configures the GCS backend (uses the build SA's ADC automatically).
  - id: init
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args: ["init", "-input=false"]

  # 2) fetch-plan — download the EXACT destroy plan file that was
  #    reviewed before this build was approved. Fails loudly if
  #    _PLAN_BUILD_ID wasn't passed in, so this can't silently destroy
  #    against nothing / the wrong plan.
  - id: fetch-plan
    name: gcr.io/cloud-builders/gsutil
    entrypoint: sh
    args:
      - -c
      - |
        if [ -z "${_PLAN_BUILD_ID}" ]; then
          echo "ERROR: _PLAN_BUILD_ID not set. This trigger must be fired by the destroy-plan build, not run standalone."
          exit 1
        fi
        gsutil cp gs://${_PLAN_BUCKET}/plans/${_PLAN_BUILD_ID}/tfplan destroy-tfplan

  # 3) apply — applies the saved, reviewed DESTROY plan. No -var flags
  #    here on purpose: the plan file already has everything baked in.
  - id: destroy-apply
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args: ["destroy", "-input=false", "-auto-approve", "destroy-tfplan"]
options:
  logging: CLOUD_LOGGING_ONLY
