# =====================================================================
# Terraform PLAN pipeline in Cloud Build.
#   fmt -> init -> validate -> plan -> upload plan -> trigger apply build
#
# Pattern:
#   - "plan" trigger  : on push/PR -> runs this file -> review the plan
#   - on success, automatically fires the "terraform-apply" trigger,
#     which is gated by "Require approval" in the Cloud Build UI = your gate
#   - the apply build fetches THIS EXACT plan file from GCS, so apply
#     uses exactly what was reviewed here — no drift, no surprises.
#
# State lives in the existing GCS backend (backend.tf: bucket aswarda-tfstate-dev).
# Plan artifacts are stored in the same bucket under plans/<BUILD_ID>/tfplan.
# Run from the repo root that contains the .tf files.
# =====================================================================
tags:
  - aswarda-terraform-plan-$SHORT_SHA

substitutions:
  _TF_VERSION: "1.9.8"
  _PLAN_BUCKET: "aswarda-tfstate-dev"
  _APPLY_TRIGGER_NAME: "terraform-apply" # name of the apply trigger, created separately
  _PLAN_BUCKET: "aswarda-tfstate-dev"

steps:
  # 1) fmt check — fail early if code isn't formatted.
  - id: fmt
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args: ["fmt", "-recursive"]

  # 2) init — configures the GCS backend (uses the build SA's ADC automatically).
  - id: init
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args: ["init", "-input=false"]

  # 3) validate — static checks.
  - id: validate
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args: ["validate"]

  # 4) plan — write a plan file so apply uses EXACTLY what was reviewed.
  - id: plan
    name: hashicorp/terraform:${_TF_VERSION}
    entrypoint: terraform
    args:
      - plan
      - -input=false
      - -var=project_id=$PROJECT_ID
      - -out=tfplan

  # 5) upload-plan — persist the exact binary plan file so the apply
  #    build (a separate, fresh workspace) can fetch this SAME plan.
  - id: upload-plan
    name: gcr.io/cloud-builders/gsutil
    args:
      - cp
      - tfplan
      - gs://${_PLAN_BUCKET}/plans/$BUILD_ID/tfplan

  # 6) trigger-apply — fire the apply trigger, passing this build's ID
  #    so the apply build knows exactly which plan file to download.
  #    Because the apply trigger has "Require approval" enabled, this
  #    call only creates a PENDING build — it will not run until a
  #    human with the Cloud Build Approver role approves it.
  - id: trigger-apply
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - builds
      - triggers
      - run
      - ${_APPLY_TRIGGER_NAME}
      - --region=us-central1
      - --branch=$BRANCH_NAME
      - --substitutions=_PLAN_BUILD_ID=$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
